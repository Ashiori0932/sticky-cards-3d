<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbfff2" />
  <meta
          name="description"
          content="An automatically playing Three.js 3D sticky-card sequence."
  />
  <title>Sticky Cards — Three.js</title>
</head>
<body>
<main id="app">
  <section class="hero" aria-label="Interactive 3D cards">
    <div class="hero-content">
      <h1>Sit back and watch everything fall into place</h1>
    </div>
    <div class="three-container" aria-hidden="true"></div>
    <div class="autoplay-hint" aria-hidden="true">
      <span>AUTOPLAY</span>
      <span class="playback-line"></span>
    </div>
  </section>

  <section class="about">
    <h3>
      A quiet progression of motion and stillness, where each layer
      reveals itself with intention and nothing feels out of place.
    </h3>
  </section>

  <section class="outro">
    <p>EVERYTHING IN ITS PLACE.</p>
  </section>
</main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
